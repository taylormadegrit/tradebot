mode: offline            # offline | demo | live

# Offline paper trading. In `mode: offline` the bot fills fake entries against the
# real candle data (data/<SYM>.csv), marks them to market every tick, closes on
# SL/TP, and keeps a running demo P&L + trade log -- so strategies get tested with
# no broker attached. State persists to data/paper_state.json.
paper:
  start_balance: 100000     # demo cash -- a real $200 account sizes every trade to zero
  persist: true             # keep the paper account + trades across restarts
  ignore_windows: true      # take entries any time (set false to respect session windows)
  spread_pips:              # simulated spread per instrument (in that symbol's pips)
    XAUUSD: 2.0
    US30: 2.0
    US100: 2.0

broker:
  environment: https://demo.tradelocker.com
  server: ""             # from the TradeLocker login screen, e.g. HEROFX-Demo

# Starting focus: gold first, then the two US indices.
# `windows` names come from bot/sessions.py PRESETS. Empty/absent = trade any time.
instruments:
  - symbol: XAUUSD
    timeframe: 5m
    strategy: ma_crossover
    params: { fast: 20, slow: 50, sl_pips: 120, tp_pips: 240 }   # pip=0.1 -> 120 = $12 move
    windows: [london_ny_overlap, london_pm_fix]

  - symbol: US30
    timeframe: 5m
    strategy: orb
    params: { tz: America/New_York, open: "09:30", range_minutes: 15, rr: 2.0 }
    windows: [ny_equity_open_90m]

  - symbol: US100
    timeframe: 5m
    strategy: orb
    params: { tz: America/New_York, open: "09:30", range_minutes: 15, rr: 2.0 }
    windows: [ny_equity_open_90m]

risk:
  risk_per_trade_pct: 0.5      # % of equity risked per trade
  max_position_lots: 0.05      # hard ceiling regardless of sizing math
  max_open_positions: 2
  daily_loss_halt_pct: 3.0     # at -3% on the day: flatten everything, stop until tomorrow

poll_seconds: 15

data:
  source: oanda            # datafeed process refreshes data/<SYM>.csv from OANDA
  granularity: M15
  bars: 5000
  refresh_seconds: 120

# Monitor-only tickers -- NO trading. Alerts (sound + phone + the ticker's own
# Discord thread + annotated chart) every time one prints a new high: a high
# above the prior <lookback> bars. Data comes from Yahoo via the datafeed
# process into data/<SYMBOL>.csv, exactly like the traded instruments.
watchlist:
  enabled: true
  interval: 15m           # Yahoo bar size (15m history reaches back ~1 month)
  range: 1mo
  lookback: 60            # "new high" = above the highest high of the last 60 bars
  refresh_seconds: 300
  tickers:
    - { symbol: MU,  yahoo: MU }      # Micron
    - { symbol: AMD, yahoo: AMD }     # AMD
    - { symbol: BE,  yahoo: BE }      # Bloom Energy

# Per-ticker headlines (Yahoo Finance RSS) for EVERY instrument and watchlist
# ticker, posted into that ticker's Discord thread, always tagged as news.
# Context only -- never touches order logic.
news:
  enabled: true
  refresh_minutes: 20
  lookback_hours: 24         # first sight of a ticker: seed to now, don't post older items
  max_per_cycle: 3           # cap headlines per ticker per refresh so a thread can't flood
  label: "NEWS"
  impact: true               # add a "what could this do to the price" line to each headline
  impact_model: claude-opus-5  # used only if ANTHROPIC_API_KEY is set in .env; else a rule-based read
  map:                       # symbol -> Yahoo symbol for its news feed
    XAUUSD: "GC=F"
    US30: "^DJI"
    US100: "^NDX"

# Event-risk blackout: refuse NEW entries in a window around high-impact
# economic releases (CPI, PCE, NFP, FOMC, GDP, ISM ...). Pure risk control --
# it only ever blocks a trade, never opens one. Calendar = ForexFactory's free
# weekly JSON, refreshed by the datafeed process into data/calendar.json.
calendar:
  enabled: true
  url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  impacts: [High]            # impact levels that trigger a blackout
  currencies: [USD]          # events in these currencies black out every instrument
  before_minutes: 30
  after_minutes: 30
  on_missing: allow          # allow | block  -- what to do if calendar.json is absent/stale
  stale_hours: 48
  refresh_hours: 6

alerts:
  sound: true                # play a sound on this PC when something fires
  sound_file: "assets/kaching.wav"   # path is relative to the project folder; absolute paths also work
  ntfy_topic: ""             # install the "ntfy" phone app, pick a hard-to-guess name, put it here
  telegram_token: ""         # optional
  telegram_chat_id: ""       # optional
  discord: true              # post alerts to the Discord channel in .env (DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID)
  discord_threads: true      # give each ticker its own thread in that channel so alerts don't blur together
  cooldown_seconds: 1800     # same alert won't repeat within 30 min

api:
  host: 127.0.0.1
  port: 8787
